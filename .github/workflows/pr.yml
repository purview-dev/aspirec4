name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    with:
      run-pack: true
      validate-pack: true
    secrets: inherit

  # The TypeScript, Go and Python sample AppHosts, which the shared pipeline cannot run.
  apphosts:
    name: AppHosts
    uses: ./.github/workflows/apphosts.yml
    permissions:
      contents: read

  # The ER viewer and Mermaid preview in a real browser, which no test project can drive.
  erd:
    name: ER viewer
    uses: ./.github/workflows/erd.yml
    permissions:
      contents: read
