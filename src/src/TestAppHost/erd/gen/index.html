<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AspireC4 Sample Schema</title>
		<link rel="stylesheet" href="./vendor/reactflow.css" />
		<style>
			:root {
				color-scheme: light dark;
				--bg: #ffffff;
				--fg: #1b1b1f;
				--muted: #6b7280;
				--line: #d4d4d8;
				--panel: #f6f6f7;
				--accent: #3b82f6;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #141417;
					--fg: #e8e8ea;
					--muted: #9ca3af;
					--line: #2e2e33;
					--panel: #1c1c20;
				}
			}

			* {
				box-sizing: border-box;
			}

			html,
			body,
			#root {
				height: 100%;
				margin: 0;
			}

			body {
				background: var(--bg);
				color: var(--fg);
				font:
					13px/1.45 ui-sans-serif,
					system-ui,
					-apple-system,
					Segoe UI,
					sans-serif;
			}

			.toolbar {
				position: absolute;
				z-index: 10;
				top: 12px;
				left: 12px;
				display: flex;
				gap: 8px;
				align-items: center;
				padding: 8px 10px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--panel);
			}

			.toolbar input {
				min-width: 220px;
				padding: 5px 8px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--bg);
				color: inherit;
				font: inherit;
			}

			.toolbar .count {
				color: var(--muted);
			}

			.entity {
				min-width: 200px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--panel);
				overflow: hidden;
			}

			.entity.dimmed {
				opacity: 0.25;
			}

			.entity.hit {
				outline: 2px solid var(--accent);
			}

			.entity header {
				padding: 6px 10px;
				border-bottom: 1px solid var(--line);
				font-weight: 600;
			}

			.entity header .ctx {
				display: block;
				color: var(--muted);
				font-size: 11px;
				font-weight: 400;
			}

			.entity .col {
				display: flex;
				gap: 8px;
				justify-content: space-between;
				padding: 3px 10px;
			}

			.entity .col .type {
				color: var(--muted);
			}

			.badge {
				margin-left: 4px;
				padding: 0 4px;
				border-radius: 4px;
				background: var(--line);
				font-size: 10px;
			}

			/*
			 * Edges flow toward the many end; disabled when the OS asks for reduced motion.
			 *
			 * React Flow applies an edge's className to the edge GROUP, not to the path inside it, so
			 * the animation has to be targeted through the group. Its default edges carry no
			 * marker-start/marker-end either, which is why direction is decided from the model rather
			 * than read off the markers.
			 */
			.react-flow__edge.flowing .react-flow__edge-path {
				stroke-dasharray: 6 4;
				animation: dash 0.9s linear infinite;
			}

			@keyframes dash {
				to {
					stroke-dashoffset: -10;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.react-flow__edge.flowing .react-flow__edge-path {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./app.js"></script>
	</body>
</html>
