<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>__TITLE__</title>
		<style>
			/*
			 * One token block for all three themes, matching the interactive viewer: light-dark()
			 * resolves against the element's own color-scheme, so pinning a theme is a one-line
			 * change to :root rather than a second palette.
			 */
			:root {
				color-scheme: light dark;
				--bg: light-dark(#ffffff, #141417);
				--fg: light-dark(#1b1b1f, #e8e8ea);
				--muted: light-dark(#6b7280, #9ca3af);
				--line: light-dark(#d4d4d8, #2e2e33);
				--panel: light-dark(#f6f6f7, #1c1c20);
				--wash: light-dark(rgb(0 0 0 / 11%), rgb(255 255 255 / 11%));
			}

			:root[data-theme="light"] {
				color-scheme: light;
			}

			:root[data-theme="dark"] {
				color-scheme: dark;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				margin: 0;
			}

			body {
				overflow: hidden;
				background: var(--bg);
				color: var(--fg);
				font:
					13px/1.45 ui-sans-serif,
					system-ui,
					-apple-system,
					Segoe UI,
					sans-serif;
			}

			.toolbar {
				position: absolute;
				z-index: 10;
				top: 12px;
				left: 12px;
				display: flex;
				gap: 10px;
				align-items: center;
				padding: 8px 10px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--panel);
			}

			.toolbar button {
				padding: 4px 8px;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--bg);
				color: inherit;
				font: inherit;
				cursor: pointer;
			}

			.toolbar button[aria-pressed="true"] {
				background: var(--wash);
			}

			.toolbar .hint,
			.toolbar .label {
				color: var(--muted);
			}

			.toolbar .sep {
				width: 1px;
				height: 18px;
				background: var(--line);
			}

			.segmented {
				display: flex;
				gap: 3px;
			}

			#stage {
				width: 100%;
				height: 100%;
				cursor: grab;
			}

			#stage.panning {
				cursor: grabbing;
			}

			#canvas {
				transform-origin: 0 0;
			}

			#error {
				margin: 72px 24px;
				color: #f43f5e;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				white-space: pre-wrap;
			}
		</style>
		<script>
			/*
			 * Applies the pinned theme before anything paints, so a dark-pinned preview on a light
			 * desktop does not flash white while the module loads. Shares its key with the
			 * interactive viewer: a reader who pinned a theme there meant it for the diagram, not
			 * for one renderer of it.
			 */
			try {
				const stored = localStorage.getItem("aspirec4-erd-theme");

				if (stored === "light" || stored === "dark") {
					document.documentElement.dataset.theme = stored;
				}
			} catch {
				/* no stored preference available */
			}
		</script>
	</head>
	<body>
		<div class="toolbar">
			<button id="fit" type="button">Fit</button>
			<button id="reset" type="button">100%</button>
			<span class="sep"></span>
			<span class="label">Export</span>
			<button data-export="png" type="button">PNG</button>
			<button data-export="svg" type="button">SVG</button>
			<span class="sep"></span>
			<div class="segmented" role="group" aria-label="Theme">
				<button data-theme-option="auto" type="button">Auto</button>
				<button data-theme-option="light" type="button">Light</button>
				<button data-theme-option="dark" type="button">Dark</button>
			</div>
			<span class="hint">scroll to zoom · drag to pan</span>
		</div>
		<div id="stage"><div id="canvas"></div></div>
		<div id="error" hidden></div>
		<script type="module" src="./mermaid-app.js"></script>
	</body>
</html>
