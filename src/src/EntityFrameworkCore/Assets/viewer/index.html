<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>__TITLE__</title>
		<link rel="stylesheet" href="./vendor/reactflow.css" />
		<style>
			/*
			 * The viewer runs offline with no CDN, so no typeface can be loaded. Character comes from
			 * colour, structure and rhythm instead: context colour marks where a table came from, key
			 * colour marks what a column does, and monospace is reserved for store types, which are
			 * code rather than prose.
			 */
			:root {
				color-scheme: light dark;
				--bg: #fbfbfd;
				--panel: #ffffff;
				--fg: #1a1d23;
				--muted: #6e7480;
				--line: #e3e5ea;
				--accent: #3b82f6;
				--pk: #b45309;
				--fk: #1d4ed8;
				--uk: #7e22ce;
				--key-bg: 0 0 0;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f1419;
					--panel: #161c23;
					--fg: #e6e8ec;
					--muted: #8b93a1;
					--line: #242c36;
					--pk: #f59e0b;
					--fk: #60a5fa;
					--uk: #c084fc;
					--key-bg: 255 255 255;
				}
			}

			* {
				box-sizing: border-box;
			}

			html,
			body,
			#root {
				height: 100%;
				margin: 0;
			}

			body {
				background: var(--bg);
				color: var(--fg);
				font:
					12.5px/1.5 ui-sans-serif,
					system-ui,
					-apple-system,
					Segoe UI,
					sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			.toolbar {
				position: absolute;
				z-index: 10;
				top: 14px;
				left: 14px;
				display: flex;
				gap: 12px;
				align-items: center;
				padding: 7px 9px;
				border: 1px solid var(--line);
				border-radius: 3px;
				background: var(--panel);
			}

			.toolbar input {
				min-width: 230px;
				padding: 5px 8px;
				border: 1px solid var(--line);
				border-radius: 2px;
				background: var(--bg);
				color: inherit;
				font: inherit;
			}

			.toolbar input:focus-visible {
				border-color: var(--accent);
				outline: 2px solid rgb(59 130 246 / 35%);
				outline-offset: 1px;
			}

			.toolbar .count {
				padding-right: 2px;
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}

			/*
			 * One container per DbContext. The label sits on the border line the way it would on a
			 * schematic drawing, rather than floating above the box as a heading.
			 */
			.context {
				width: 100%;
				height: 100%;
				border: 1px solid;
				border-radius: 2px;
			}

			.context-label {
				position: absolute;
				top: -0.62em;
				left: 14px;
				padding: 0 8px;
				background: var(--bg);
				font-size: 12px;
				font-weight: 600;
			}

			/* Catalogue cards: squarer than the container, held by a rule rather than a shadow. */
			.entity {
				min-width: 200px;
				border: 1px solid var(--line);
				border-radius: 3px;
				background: var(--panel);
				overflow: hidden;
			}

			.entity.dimmed {
				opacity: 0.22;
			}

			.entity.hit {
				border-color: var(--accent);
				box-shadow: 0 0 0 2px rgb(59 130 246 / 28%);
			}

			.entity header {
				display: flex;
				gap: 10px;
				align-items: baseline;
				justify-content: space-between;
				padding: 7px 11px 6px;
				border-bottom: 2px solid;
				font-size: 13px;
				font-weight: 600;
				letter-spacing: -0.01em;
			}

			.entity header .schema {
				color: var(--muted);
				font-size: 11px;
				font-weight: 400;
			}

			.entity .col {
				display: flex;
				gap: 10px;
				align-items: baseline;
				justify-content: space-between;
				padding: 4px 11px;
			}

			.entity .col + .col {
				border-top: 1px solid rgb(var(--key-bg) / 7%);
			}

			.entity .col .name {
				display: flex;
				gap: 5px;
				align-items: baseline;
			}

			/* Store types are code, so they are set as code. */
			.entity .col .type {
				color: var(--muted);
				font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, monospace;
				font-size: 11px;
			}

			/* Colour separates what a column does: key, reference, uniqueness. */
			.badge {
				padding: 1px 4px;
				border-radius: 2px;
				background: rgb(var(--key-bg) / 6%);
				font-size: 9px;
				font-weight: 700;
				letter-spacing: 0.04em;
			}

			.badge.pk {
				color: var(--pk);
			}

			.badge.fk {
				color: var(--fk);
			}

			.badge.uk {
				color: var(--uk);
			}

			/* React Flow's own chrome defaults to light; without this it floats white over the dark theme. */
			.react-flow__minimap {
				border: 1px solid var(--line);
				border-radius: 3px;
				background: var(--panel);
			}

			.react-flow__minimap-mask {
				fill: rgb(var(--key-bg) / 7%);
			}

			.react-flow__minimap-node {
				fill: var(--line);
			}

			.react-flow__controls {
				border: 1px solid var(--line);
				border-radius: 3px;
				box-shadow: none;
				overflow: hidden;
			}

			.react-flow__controls-button {
				border-bottom: 1px solid var(--line);
				background: var(--panel);
				fill: var(--fg);
			}

			.react-flow__controls-button:hover {
				background: var(--bg);
			}

			.react-flow__background pattern circle {
				fill: rgb(var(--key-bg) / 10%);
			}

			/*
			 * Edges flow toward the many end; disabled when the OS asks for reduced motion.
			 *
			 * React Flow applies an edge's className to the edge GROUP, not to the path inside it, so
			 * the animation has to be targeted through the group. Its default edges carry no
			 * marker-start/marker-end either, which is why direction is decided from the model rather
			 * than read off the markers.
			 */
			.react-flow__edge.flowing .react-flow__edge-path {
				stroke-dasharray: 6 4;
				animation: dash 0.9s linear infinite;
			}

			@keyframes dash {
				to {
					stroke-dashoffset: -10;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.react-flow__edge.flowing .react-flow__edge-path {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./app.js"></script>
	</body>
</html>
